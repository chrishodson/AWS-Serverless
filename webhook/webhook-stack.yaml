
AWSTemplateFormatVersion: '2010-09-09'
Description: S3 bucket with lifecycle, Lambda for webhook recording, and API Gateway endpoint

Parameters:
  LambdaCodeBucket:
    Type: String
    Description: S3 bucket containing the Lambda deployment package
    Default: 'port-webhook-demo'
  LambdaCodeFunction:
    Type: String
    Description: Name of the Lambda function
    Default: 'recorder.zip'

Resources:

  WebhookBucket:
    Type: AWS::S3::Bucket
    Properties:
      #BucketName: !Sub '${AWS::StackName}-webhook-bucket'
      LifecycleConfiguration:
        Rules:
          - Id: DeleteWebhookObjects
            Prefix: 'webhooks/'
            Status: Enabled
            ExpirationInDays: 7
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: false
        IgnorePublicAcls: true
        RestrictPublicBuckets: false

  WebhookBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebhookBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowPublicReadOnWebhooksPrefix
            Effect: Allow
            Principal: '*'
            Action:
              - s3:GetObject
            Resource: !Sub '${WebhookBucket.Arn}/webhooks/*'

  WebhookLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt WebhookBucket.Arn
                  - !Sub '${WebhookBucket.Arn}/*'

  WebhookLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-webhook-recorder'
      Handler: recorder.handler
      Role: !GetAtt WebhookLambdaRole.Arn
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeFunction
      Runtime: python3.13
#      Architectures:
#        - arm64
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          WEBHOOK_SECRET: !Sub '${AWS::StackId}'
          S3_BUCKET: !Ref WebhookBucket
          S3_PREFIX: 'webhooks/'

  WebhookApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: WebhookApi
      ProtocolType: HTTP

  WebhookApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebhookApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebhookLambda.Arn}/invocations'
      PayloadFormatVersion: '2.0'

  WebhookApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebhookApi
      RouteKey: 'POST /webhook'
      Target: !Sub 'integrations/${WebhookApiIntegration}'

  WebhookApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WebhookApi
      StageName: 'prod'
      AutoDeploy: true

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: 'lambda:InvokeFunction'
      FunctionName: !Ref WebhookLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebhookApi}/*/POST/webhook'

Outputs:
  WebhookApiEndpoint:
    Description: 'URL endpoint for webhook'
    Value: !Sub 'https://${WebhookApi}.execute-api.${AWS::Region}.amazonaws.com/prod/webhook'
  WebhookSecret:
    Description: 'Secret for verifying webhook signatures'
    Value: !Sub '${AWS::StackId}'
